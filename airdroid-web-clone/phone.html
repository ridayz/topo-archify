<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Pairing HP</title><link rel="stylesheet" href="style.css"/></head><body class="auth-bg"><div id="login"><div class="login-card"><div class="login-left"><div class="brand">Pairing</div><h2 id="ph-t">Menghubungkan</h2><p id="ph-d"></p><input id="ph-name" placeholder="Nama HP" style="width:100%;padding:10px;border-radius:8px;border:1px solid #22314b;background:#070b16;color:#fff;margin:8px 0"/><button class="btn primary" id="ph-ok">Ya, hubungkan HP ini</button><div id="ph-share" class="hidden"><h3>Terhubung!</h3><input type="file" id="ph-file" multiple style="margin-top:10px"/><button class="btn primary" id="ph-send">Kirim file ke laptop</button><p class="hint" id="ph-msg"></p><h4>Daftar aplikasi HP</h4><textarea id="ph-apps" rows="4" placeholder="Satu per baris, misal: WhatsApp" style="width:100%;padding:8px;border-radius:8px"></textarea><button class="btn ghost" id="ph-appsend">Kirim daftar aplikasi</button></div></div></div></div><script>const code=((location.hash.match(/#\/pair\/([A-Za-z0-9-]+)/)||[])[1]||(location.pathname.match(/\/pair\/([A-Za-z0-9-]+)/)||[])[1]);if(!code){document.getElementById("ph-t").textContent="QR tidak valid";document.getElementById("ph-ok").style.display="none";}else{document.getElementById("ph-d").innerHTML="Kode: <b>"+code+"</b>";document.getElementById("ph-ok").onclick=async()=>{const name=document.getElementById("ph-name").value||"HP";const r=await fetch(location.origin+"/api/session/"+code+"/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});if(!r.ok){document.getElementById("ph-t").textContent="QR kedaluwarsa, scan ulang";return;}document.getElementById("ph-ok").style.display="none";document.getElementById("ph-share").classList.remove("hidden");document.getElementById("ph-t").textContent="Terhubung!";document.getElementById("ph-send").onclick=async()=>{const fs=document.getElementById("ph-file").files;for(const f of fs){await fetch(location.origin+"/api/session/"+code+"/files",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name,size:(f.size/1024).toFixed(1)+" KB"})});}document.getElementById("ph-msg").textContent=fs.length+" file terkirim";};document.getElementById("ph-appsend").onclick=async()=>{const apps=document.getElementById("ph-apps").value.split("\n").map(s=>s.trim()).filter(Boolean).map(n=>({name:n}));await fetch(location.origin+"/api/session/"+code+"/apps",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({apps})});document.getElementById("ph-msg").textContent=apps.length+" aplikasi terkirim";};};}</script></body></html>
