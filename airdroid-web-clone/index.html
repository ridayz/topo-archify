<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AirDroid Web | Manage your phone on web</title>
<link rel="stylesheet" href="style.css?v=3"/>
</head>
<body class="auth-bg">
<div id="block-loading"><div class="airdroid"></div><div class="block-loading-area"><div class="block-loading-bar" id="boot-bar"></div></div><div class="block-loading-text" id="boot-text">0%</div></div>
<div id="desktop" class="hidden">
<div id="wallpaper"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="stars"></div><div id="wall-grid"></div><div id="wall-wave"></div><div id="wall-vig"></div></div>
<div id="topbar"><span class="tb-l">📱 <b id="tb-name">Belum ada perangkat</b></span><input id="search" placeholder="Search"/><span class="tb-r"><span id="tb-conn" class="pill off">● offline</span><a id="btn-dev">Perangkat</a></span></div>
<div id="icons"></div>
<div id="dock"></div>
<div id="dev-panel" class="hidden"><div class="dev-head"><b>Perangkat di jaringan ini</b><span id="dev-x">✕</span></div><div id="dev-list"></div><div class="dev-foot"><p>Buka di HP (satu WiFi):</p><code id="dev-url"></code><p class="hint">Tanpa aplikasi — HP cukup buka link, isi nama, tekan Hubungkan.</p><button class="btn ghost" id="btn-sim">Simulasi HP masuk</button></div></div>
<div id="win" class="hidden"><div id="win-bar"><div class="win-btns"><i class="r"></i><i class="y"></i><i class="g"></i></div><span id="win-title">Files</span><span id="win-x">✕</span></div><div id="win-body"></div></div>
<div id="toast"></div>
</div>
<script src="app.js?v=3"></script>
</body>
</html>
