<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic DNA Helix — CSS</title>
<meta property="og:title" content="Magic DNA Helix">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='%2300f0ff'/></svg>">
<style>
*{margin:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Poppins,Manrope,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
main{text-align:center}
h1{font-size:24px;letter-spacing:4px}
p{color:#8a8a8a;font-size:12px;letter-spacing:2px;margin-top:8px}
.helix{height:480px;width:400px;position:relative;margin:24px auto;perspective:800px}
.pair{position:absolute;left:50%;top:0;width:0;transform-style:preserve-3d;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
.rung{position:absolute;left:-110px;top:9px;width:220px;height:2px;background:#272727}
.shape{position:absolute;top:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:22px;animation:counter 6s linear infinite}
@keyframes counter{to{transform:rotateY(-360deg) rotate(360deg)}}
.shape.l{left:-122px}.shape.r{left:100px}
@media (prefers-reduced-motion:reduce){.pair,.shape{animation:none}}
</style>
</head>
<body>
<main>
<h1>MAGIC DNA</h1>
<p>CIRCLE • SQUARE • TRIANGLE • DIAMOND • HEXAGON</p>
<div class="helix" id="hx"></div>
</main>
<script>
const hx=document.getElementById('hx');
const glyphs=['●','■','▲','◆','⬢'];
const cA=['#00f0ff','#7b2ff7','#ff2fb3','#00ffa3','#ffd319'];
const cB=['#ff5e3a','#ff2fb3','#7b2ff7','#00f0ff','#00ffa3'];
for(let i=0;i<20;i++){
  const p=document.createElement('div');
  p.className='pair';
  p.style.top=(i*23)+'px';
  p.style.animationDelay=(-i*0.3)+'s';
  const g=glyphs[i%5];
  p.innerHTML=`<div class="rung"></div>
    <div class="shape l" style="color:${cA[i%5]};animation-delay:${-i*0.3}s">${g}</div>
    <div class="shape r" style="color:${cB[i%5]};animation-delay:${-i*0.3}s">${g}</div>`;
  hx.appendChild(p);
}
</script>
</body>
</html>
